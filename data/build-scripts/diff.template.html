<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What each plan sees that the other doesn't</title>
<meta name="description" content="Side by side: the five places the Ring Road would give us, and the eighteen our plan keeps. Every entry links to Google Maps.">
<style>
:root{
  color-scheme: light;
  --ground:#EDF1F2; --surface:#FAFBFB; --raised:#FFFFFF;
  --ink:#0E1518; --ink-2:#4A5A61; --ink-3:#7A8B92;
  --line:#D4DDE0; --line-2:#E3EAEC;
  --accent:#0B6874; --accent-ink:#08535D; --accent-soft:#DCEAED;
  --ok:#4E9E5F; --warn:#B5730B; --bad:#9E2F20;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --serif:ui-serif,"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#0C1114; --surface:#131A1D; --raised:#182125;
  --ink:#E9F0F2; --ink-2:#9BAFB7; --ink-3:#68797F;
  --line:#222E33; --line-2:#1A2428;
  --accent:#4FC0CB; --accent-ink:#8FDCE4; --accent-soft:#102A2F;
  --ok:#48A865; --warn:#BE8A1A; --bad:#B8452F;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0C1114; --surface:#131A1D; --raised:#182125;
  --ink:#E9F0F2; --ink-2:#9BAFB7; --ink-3:#68797F;
  --line:#222E33; --line-2:#1A2428;
  --accent:#4FC0CB; --accent-ink:#8FDCE4; --accent-soft:#102A2F;
  --ok:#48A865; --warn:#BE8A1A; --bad:#B8452F;
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased}
.wrap{max-width:1040px; margin:0 auto; padding:42px 22px 80px}
h1,h2,h3{margin:0; letter-spacing:-.025em; text-wrap:balance}
h1{font-size:clamp(25px,3.7vw,36px); line-height:1.07; font-weight:700}
h1 .thin{font-weight:300; color:var(--ink-2)}
p{margin:0 0 13px}
.lede{font-size:17px; color:var(--ink-2); margin-top:12px; max-width:62ch}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500}
#themeBtn{float:right; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em;
  text-transform:uppercase; background:var(--raised); border:1px solid var(--line);
  color:var(--ink-2); border-radius:5px; padding:6px 10px; cursor:pointer}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:30px; align-items:start}
.col{background:var(--surface); border:1px solid var(--line); border-radius:7px; overflow:hidden}
.col.lose{border-color:var(--bad)}
.col.keep{border-color:var(--ok)}
.col-h{padding:15px 18px; border-bottom:1px solid var(--line)}
.col.lose .col-h{background:color-mix(in srgb, var(--bad) 8%, transparent)}
.col.keep .col-h{background:color-mix(in srgb, var(--ok) 8%, transparent)}
.col-h h2{font-size:18px}
.col-h .count{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); margin-top:3px; display:block}
ol{list-style:none; margin:0; padding:0}
li{padding:13px 18px; border-bottom:1px solid var(--line-2); display:flex; gap:12px}
li:last-child{border-bottom:0}
.rk{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.03em;
  padding:3px 6px; border-radius:4px; height:fit-content; white-space:nowrap;
  border:1px solid var(--warn); color:var(--warn)}
.rk.none{border-color:var(--line); color:var(--ink-3)}
.bd{min-width:0; flex:1}
.bd h3{font-size:15.5px}
.bd h3 a{color:inherit; text-decoration:none; border-bottom:1px solid var(--line)}
.bd h3 a:hover{color:var(--accent-ink); border-bottom-color:var(--accent)}
.bd p{margin:3px 0 0; font-size:13.5px; color:var(--ink-2); font-family:var(--serif)}
.bd .gl{display:inline-block; margin-top:6px; font-family:var(--mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; text-decoration:none; color:var(--accent-ink);
  border:1px solid var(--accent); background:var(--accent-soft); border-radius:4px; padding:3px 7px}
.bd .gl:hover{background:var(--accent); color:var(--surface)}
.tally{display:flex; flex-wrap:wrap; border:1px solid var(--line); background:var(--surface);
  border-radius:6px; margin:20px 0 0}
.tally div{flex:1 1 150px; padding:13px 16px; border-right:1px solid var(--line-2)}
.tally div:last-child{border-right:0}
.tally .v{font-family:var(--mono); font-size:20px; font-weight:600; letter-spacing:-.04em;
  display:block; font-variant-numeric:tabular-nums}
.tally .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3)}
.note{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:6px; padding:15px 18px; margin-top:26px}
.note p:last-child{margin-bottom:0}
footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink-3)}
@media (max-width:760px){ .cols{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <button id="themeBtn" type="button">Theme</button>
  <p class="eyebrow">Our plan vs the Ring Road · everything else is common to both</p>
  <h1>What each one sees<br><span class="thin">that the other doesn't</span></h1>
  <p class="lede">Both plans share the Golden Circle, the whole south coast, the ice cave, Skaftafell
    and the glacier lagoons. These are the only differences — <span id="ledeCount"></span>.</p>

  <div class="tally" id="tally"></div>
  <div class="cols">
    <div class="col lose" id="colLose"></div>
    <div class="col keep" id="colKeep"></div>
  </div>

  <div class="note" id="note"></div>
  <footer id="foot"></footer>
</div>

<script type="application/json" id="d">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent);
const $=s=>document.querySelector(s);
const el=(t,a={},k=[])=>{const n=document.createElement(t);
  for(const[x,v]of Object.entries(a)){if(v==null)continue;
    if(x==='text')n.textContent=v;else if(x==='html')n.innerHTML=v;else n.setAttribute(x,v);}
  (Array.isArray(k)?k:[k]).forEach(c=>c&&n.appendChild(c));return n;};
const gmaps=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);
const hm=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
(function(){const T=['auto','light','dark'];let t=localStorage.getItem('is-theme')||'auto';
  const ap=()=>{t==='auto'?document.documentElement.removeAttribute('data-theme')
    :document.documentElement.setAttribute('data-theme',t);
    $('#themeBtn').textContent='Theme: '+t;localStorage.setItem('is-theme',t);};
  $('#themeBtn').onclick=()=>{t=T[(T.indexOf(t)+1)%3];ap();};ap();})();

const rkTop=a=>a.filter(x=>x.rank).length;
[[String(D.ringOnly.length),'places only the Ring has'],
 [String(D.oursOnly.length),'places only we have'],
 [rkTop(D.ringOnly)+' vs '+rkTop(D.oursOnly),'of those, top-20 sights'],
 [D.ringKm.toLocaleString()+' km','the Ring drives'],
 [D.ourKm.toLocaleString()+' km','we drive']]
 .forEach(([v,k])=>$('#tally').append(el('div',{},
   [el('span',{class:'v',text:v}),el('span',{class:'k',text:k})])));

function col(host,cls,title,sub,items){
  const h=el('div',{class:'col-h'},[el('h2',{text:title}),el('span',{class:'count',text:sub})]);
  const ol=el('ol');
  items.forEach(it=>{
    const li=el('li');
    li.append(el('span',{class:'rk'+(it.rank?'':' none'),text:it.rank?('#'+it.rank):'—'}));
    li.append(el('div',{class:'bd'},[
      el('h3',{},el('a',{href:gmaps(it.search),target:'_blank',rel:'noopener',text:it.name})),
      el('p',{text:it.why}),
      el('a',{class:'gl',href:gmaps(it.search),target:'_blank',rel:'noopener',text:'Google Maps'})]));
    ol.append(li);
  });
  host.append(h,ol);
}
col($('#colLose'),'lose','What we give up',
    D.ringOnly.length+' places · '+rkTop(D.ringOnly)+' of them top-20', D.ringOnly);
col($('#colKeep'),'keep','What we keep',
    D.oursOnly.length+' places · '+rkTop(D.oursOnly)+' of them top-20', D.oursOnly);

const dKm=D.ringKm-D.ourKm, nR=D.ringOnly.length, nO=D.oursOnly.length;
$('#ledeCount').textContent = nR===nO ? `${nR} places each` : `${nR} places against ${nO}`;
$('#note').append(
  el('p',{},el('strong',{text:'It is an even trade on count. The difference is what kind of place.'})),
  el('p',{text:`${nR} against ${nO} — but they are not interchangeable. The Ring's exclusives are `
    +'concentrated in two regions you cannot otherwise reach: the Mývatn geothermal cluster '
    +'(pseudocraters, Dimmuborgir, Grjótagjá, Hverir), the big northern waterfalls Dettifoss and '
    +'Goðafoss, the Ásbyrgi canyon, and the east fjords down to Vestrahorn.'}),
  el('p',{text:'Ours are the whole Snæfellsnes peninsula — Kirkjufell, Arnarstapi, Djúpalónssandur, '
    +'Lóndrangar, Búðakirkja — plus the Reykjanes geothermal coast and a hot river you sit in. '
    +'One trades a peninsula for a lake district.'}),
  el('p',{text:`On the top-20 list the Ring wins ${rkTop(D.ringOnly)} to ${rkTop(D.oursOnly)}, but that `
    +'list rewards fame over time spent. The real split is that the Ring is a circuit, so it costs '
    +`${dKm} km more driving (${D.ringKm.toLocaleString()} vs ${D.ourKm.toLocaleString()}) and gives `
    +'every night to a different town. The one thing only the Ring reaches is Stokksnes: Vestrahorn '
    +'is the best single landscape on either route.'}));

$('#foot').append(el('div',{html:
  'Both plans also include: Þingvellir, Geysir, Gullfoss, Seljalandsfoss, Skógafoss, Sólheimajökull, '
  + 'Dyrhólaey, Reynisfjara, the Katla ice cave, Fjaðrárgljúfur, Skaftafell, Fjallsárlón, Jökulsárlón, '
  + 'Diamond Beach and the Blue Lagoon. Links open Google Maps by place name.'}));
</script>
</body>
</html>
